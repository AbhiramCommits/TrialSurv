name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr, any::lintr, any::styler
          needs: check
          dependencies: '"hard"'
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
          upload-snapshots: true

  lint-and-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler, any::covr
          dependencies: '"hard"'
      - name: Lint
        run: |
          Rscript -e 'lints <- lintr::lint_package(); print(lints); if (length(lints) > 0) quit(status = 1)'
      - name: Style check
        run: |
          Rscript -e 'styler::style_pkg()'
          git diff --exit-code
      - name: Coverage
        run: |
          Rscript -e 'cov <- covr::package_coverage(); print(cov); cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'
