name: Render report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-report:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::quarto, any::knitr, any::rmarkdown
          dependencies: '"hard"'
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install package
        run: R CMD INSTALL .
      - name: Render the GO/NO-GO report
        run: Rscript -e 'trialsurv::render_report()'
      - uses: actions/upload-artifact@v4
        with:
          name: trialsurv-report
          path: report/trial_report.html
